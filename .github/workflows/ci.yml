name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: vakit
          POSTGRES_PASSWORD: vakit
          POSTGRES_DB: vakit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vakit -d vakit_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://vakit:vakit@localhost:5432/vakit_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    env:
      EXPO_PUBLIC_API_URL: https://api.example.com
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npx expo customize tsconfig.json >/dev/null 2>&1 || true
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci
      - run: npm run build:web

  docker:
    runs-on: ubuntu-latest
    needs: [test, client]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: ./client
          push: false
          build-args: EXPO_PUBLIC_API_URL=https://api.example.com
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
